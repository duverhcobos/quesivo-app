name: quesivo
description: "Quesivo — app móvil del sistema de gestión para queseras (SaaS multi-tenant)."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  dartz: ^0.10.1
  dio: ^5.9.2
  equatable: ^2.0.8
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.0.0
  flutter_svg: ^2.3.0
  formz: ^0.8.0
  get_it: ^9.2.1
  go_router: ^17.0.0
  http: ^1.6.0
  internet_connection_checker: ^3.0.1
  intl: ^0.20.2
  shared_preferences: ^2.5.5

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/

# Launcher icons — isotipo Quesivo. Legacy/iOS: fondo blanco (no alpha).
# Adaptive Android: foreground transparente con safe-zone 60% + bg blanco.
# Regenerar: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/quesivo_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/quesivo_icon_foreground.png"
